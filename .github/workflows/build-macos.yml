name: Build Box Flip Automator for macOS Tahoe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            label: AppleSilicon
          - runner: macos-26-intel
            label: Intel

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests
        run: |
          python -m pytest tests

      - name: Build app and DMG
        run: |
          python build_mac.py

      - name: Rename DMG
        run: |
          FILE=$(find dist-dmg -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$FILE"
          cp "$FILE" "BoxFlipAutomator-macOS-Tahoe-${{ matrix.label }}.dmg"

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: BoxFlipAutomator-macOS-Tahoe-${{ matrix.label }}
          path: BoxFlipAutomator-macOS-Tahoe-${{ matrix.label }}.dmg
          if-no-files-found: error
