name: Build Box Flip Automator Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Check app
        run: |
          python -m py_compile app.py
          python -m py_compile build_mac.py

      - name: Build Mac app
        run: |
          python build_mac.py

      - name: Find and rename DMG
        run: |
          FILE=$(find dist-dmg -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$FILE"
          cp "$FILE" "BoxFlipAutomator-macOS-Tahoe-AppleSilicon.dmg"

      - name: Upload Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: BoxFlipAutomator-macOS-Tahoe-AppleSilicon
          path: BoxFlipAutomator-macOS-Tahoe-AppleSilicon.dmg
          if-no-files-found: error
